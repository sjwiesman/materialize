#
# Custom output format for Claude skill generation
#
[outputFormats.skill]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[markup.goldmark.renderer]
# allow <a name="link-target">, the old syntax no longer works
unsafe = true

[markup]
  [markup.highligh]
    noClasses = false
    style = "monokai"

# Need to co-ordinate with toc.html
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[[deployment.targets]]
name = "production"
url = "s3://materialize-website?region=us-east-1"
# Sync only the docs, to avoid deleting the marketing website.
include = "docs/**"

# Per Hugo docs:
# The pattern syntax is documented here: https://godoc.org/github.com/gobwas/glob#Glob
# Patterns should be written with forward slashes as separator.
#
# include = "**.html" # would only include files with ".html" suffix
# exclude = "**.{jpg, png}" # would exclude files with ".jpg" or ".png" suffix

#
# Top-level documentation groups. These replace the marketing links in the
# header; the sidebar shows one group's sections at a time. A top-level menu
# entry joins a group via `menu.main.params.group`.
#

