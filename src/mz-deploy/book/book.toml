[book]
title = "The mz-deploy Book"
authors = ["Materialize"]
description = "Declarative SQL project tooling for Materialize: compile, test, deploy."
language = "en"
src = "src"

[build]
build-dir = "build"
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/MaterializeInc/materialize"
edit-url-template = "https://github.com/MaterializeInc/materialize/edit/main/src/mz-deploy/book/{path}"
